# .codex/config.toml

[sandbox]
mode = "workspace-write"

# Explicitly whitelist the external directories Codex is allowed to modify
writable_roots = [
    "/Users/jasonswartz/Code/AI-train-May-26/cuecraft/cuecraft-codex",
    "/Users/jasonswartz/Documents/box",
]

[approvals]
policy = "on-request"

[git]
# Allow Codex to manage routine git workflows automatically
allowed_operations = ["commit", "checkout", "branch", "merge", "pull", "push"]

# Explicitly forbid destructive git commands
forbidden_operations = ["branch-delete", "push-force", "reset-hard"]
