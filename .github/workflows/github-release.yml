name: GitHub Release

on:
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  release:
    permissions:
      contents: write
      id-token: write
      attestations: write
    if: >-
      github.event.pull_request.merged && github.event.pull_request.title == 'chore: release'
    runs-on: ubuntu-latest
    env:
      RELEASE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_COMMIT }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Prepare release notes
        run: node prepare-release.mjs > "$RUNNER_TEMP/release-notes.md"
      - name: Generate artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          gh release create "${VERSION}" main.js manifest.json styles.css --target "$RELEASE_COMMIT" --notes-file "$RUNNER_TEMP/release-notes.md" --title "${VERSION}"
