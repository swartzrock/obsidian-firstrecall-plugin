<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc">
  <title id="title">CueCraft Short-Form Hook Mode simplified left-margin design screenshot</title>
  <desc id="desc">An Obsidian editor mockup with compact readable hook cards in a left-side rail, small status icons, no support beats, and a bottom summary card.</desc>
  <defs>
    <linearGradient id="page" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fffaf1"/>
      <stop offset="0.58" stop-color="#f6efe4"/>
      <stop offset="1" stop-color="#efe6d4"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ff8a24"/>
      <stop offset="1" stop-color="#f6c446"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#1d7c83"/>
      <stop offset="1" stop-color="#60b9ae"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#1f1812" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1440" height="980" fill="url(#page)"/>
  <text x="70" y="58" font-family="Arial, sans-serif" font-size="15" font-weight="900" letter-spacing="3" fill="#1f7f7d">CUECRAFT EDITOR-MARGIN CONCEPT</text>
  <text x="70" y="116" font-family="Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="-2.4" fill="#202025">Small hook cards, aligned with sections.</text>
  <text x="70" y="154" font-family="Arial, sans-serif" font-size="20" fill="#6f6a75">Status is a quiet icon. Hints stay out of the card. The summary appears after the note.</text>

  <g transform="translate(70 190)" filter="url(#shadow)">
    <rect x="0" y="0" width="1300" height="710" rx="18" fill="#fffdf8" stroke="#d8d0c5"/>
    <rect x="0" y="0" width="1300" height="54" rx="18" fill="#eeeaf6"/>
    <rect x="0" y="36" width="1300" height="18" fill="#eeeaf6"/>
    <circle cx="24" cy="27" r="6" fill="#ff5f57"/><circle cx="44" cy="27" r="6" fill="#febc2e"/><circle cx="64" cy="27" r="6" fill="#28c840"/>
    <rect x="470" y="14" width="250" height="28" rx="8" fill="#fff" stroke="#d1cbe0"/>
    <text x="492" y="33" font-family="Arial, sans-serif" font-size="13" fill="#686172">claude22</text>
    <rect x="1110" y="12" width="145" height="30" rx="15" fill="#202025"/>
    <text x="1128" y="32" font-family="Arial, sans-serif" font-size="12" font-weight="800" fill="#fff">CueCraft: Hook Mode</text>

    <rect x="0" y="54" width="176" height="656" fill="#e7ddff"/>
    <text x="22" y="91" font-family="Arial, sans-serif" font-size="13" font-weight="900" fill="#564f67">Claude for Execs</text>
    <rect x="18" y="116" width="132" height="28" rx="8" fill="#cfc8f3"/>
    <text x="32" y="135" font-family="Arial, sans-serif" font-size="13" font-weight="800" fill="#302a45">claude22</text>
    <text x="32" y="174" font-family="Arial, sans-serif" font-size="13" fill="#5f5870">Cloddy</text>
    <text x="32" y="208" font-family="Arial, sans-serif" font-size="13" fill="#5f5870">exciting-cornell...</text>

    <g transform="translate(224 94)">
      <rect x="0" y="0" width="206" height="548" rx="24" fill="#f2eadc" stroke="#e0d5c6"/>
      <text x="18" y="30" font-family="Arial, sans-serif" font-size="11" font-weight="900" letter-spacing="2" fill="#776a57">HOOK</text>
      <text x="128" y="30" font-family="Arial, sans-serif" font-size="11" font-weight="900" letter-spacing="2" fill="#776a57">CARDS</text>

      <g transform="translate(16 62)">
        <rect x="0" y="0" width="174" height="112" rx="20" fill="#201915"/>
        <rect x="9" y="9" width="156" height="94" rx="15" fill="url(#hot)"/>
        <circle cx="29" cy="31" r="9" fill="#fffdf8" opacity="0.52"/>
        <text x="25" y="35" font-family="Arial, sans-serif" font-size="11" font-weight="800" fill="#211915">●</text>
        <text x="25" y="62" font-family="Arial, sans-serif" font-size="18" font-weight="760" letter-spacing="-0.6" fill="#211915">Who are the</text>
        <text x="25" y="83" font-family="Arial, sans-serif" font-size="18" font-weight="760" letter-spacing="-0.6" fill="#211915">dogs we love?</text>
      </g>

      <g transform="translate(16 236)">
        <rect x="0" y="0" width="174" height="112" rx="20" fill="#201915"/>
        <rect x="9" y="9" width="156" height="94" rx="15" fill="url(#teal)"/>
        <circle cx="29" cy="31" r="9" fill="#fffdf8" opacity="0.5"/>
        <text x="25" y="35" font-family="Arial, sans-serif" font-size="11" font-weight="800" fill="#082f33">○</text>
        <text x="25" y="62" font-family="Arial, sans-serif" font-size="18" font-weight="760" letter-spacing="-0.6" fill="#082f33">Chatbot or</text>
        <text x="25" y="83" font-family="Arial, sans-serif" font-size="18" font-weight="760" letter-spacing="-0.6" fill="#082f33">agent? Prove it.</text>
      </g>

      <g transform="translate(16 410)">
        <rect x="0" y="0" width="174" height="112" rx="20" fill="#201915"/>
        <rect x="9" y="9" width="156" height="94" rx="15" fill="url(#hot)"/>
        <circle cx="29" cy="31" r="9" fill="#fffdf8" opacity="0.52"/>
        <text x="25" y="35" font-family="Arial, sans-serif" font-size="11" font-weight="800" fill="#211915">○</text>
        <text x="25" y="62" font-family="Arial, sans-serif" font-size="17" font-weight="760" letter-spacing="-0.55" fill="#211915">How do employees</text>
        <text x="25" y="82" font-family="Arial, sans-serif" font-size="17" font-weight="760" letter-spacing="-0.55" fill="#211915">get AI-shippable?</text>
      </g>
    </g>

    <g transform="translate(500 120)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="30" font-weight="850" letter-spacing="-1" fill="#202025">Dogs We Love</text>
      <rect x="-16" y="-24" width="5" height="32" rx="3" fill="#f0aa20"/>
      <text x="0" y="38" font-family="Arial, sans-serif" font-size="17" fill="#37333d">1. Tzimmes is a dog</text>
      <text x="0" y="67" font-family="Arial, sans-serif" font-size="17" fill="#37333d">2. So is Tonks</text>

      <text x="0" y="160" font-family="Arial, sans-serif" font-size="30" font-weight="850" letter-spacing="-1" fill="#202025">Terms</text>
      <rect x="-16" y="136" width="5" height="32" rx="3" fill="#f0aa20"/>
      <text x="0" y="198" font-family="Arial, sans-serif" font-size="17" fill="#37333d">1. Agent - Independent AI that can plan, decide, and use tools.</text>
      <text x="0" y="227" font-family="Arial, sans-serif" font-size="17" fill="#37333d">2. Chatbot - single-turn interaction AI app.</text>
      <text x="0" y="256" font-family="Arial, sans-serif" font-size="17" fill="#37333d">3. Claude Code - works from the dev env.</text>
      <text x="0" y="285" font-family="Arial, sans-serif" font-size="17" fill="#37333d">4. Plugins - customize Claude for a role/team.</text>

      <text x="0" y="398" font-family="Arial, sans-serif" font-size="30" font-weight="850" letter-spacing="-1" fill="#202025">How To Upskill Employees</text>
      <rect x="-16" y="374" width="5" height="32" rx="3" fill="#f0aa20"/>
      <text x="0" y="434" font-family="Arial, sans-serif" font-size="17" fill="#37333d">Tailor AI training around standards, terms, tools, and knowledge.</text>
      <text x="0" y="463" font-family="Arial, sans-serif" font-size="17" fill="#37333d">1. Requires encoding organizational knowledge.</text>
      <text x="0" y="492" font-family="Arial, sans-serif" font-size="17" fill="#37333d">2. Teach methodology, compliance, and brand voice.</text>

      <rect x="0" y="548" width="780" height="96" rx="28" fill="#1f7f7d"/>
      <text x="32" y="584" font-family="Arial, sans-serif" font-size="12" font-weight="900" letter-spacing="3" fill="#fffdf8" opacity="0.72">SUMMARY</text>
      <text x="32" y="626" font-family="Arial, sans-serif" font-size="34" font-weight="850" letter-spacing="-1.5" fill="#fffdf8">Agents compound progress through feedback.</text>
    </g>
  </g>
</svg>
