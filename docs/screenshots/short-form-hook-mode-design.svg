<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc">
  <title id="title">CueCraft Short-Form Hook Mode left-margin design screenshot</title>
  <desc id="desc">An Obsidian editor mockup with CueCraft hook cards placed in a left-side cue rail, one card for each section of the note.</desc>
  <defs>
    <linearGradient id="page" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#faf8ff"/>
      <stop offset="1" stop-color="#f5f0e8"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fb7b25"/>
      <stop offset="1" stop-color="#f2bc2f"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#1d7c83"/>
      <stop offset="1" stop-color="#60b9ae"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#1f1812" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="1440" height="980" fill="url(#page)"/>
  <text x="70" y="58" font-family="Arial, sans-serif" font-size="15" font-weight="900" letter-spacing="3" fill="#176d73">CUECRAFT EDITOR-MARGIN CONCEPT</text>
  <text x="70" y="118" font-family="Arial Black, Arial, sans-serif" font-size="56" font-weight="900" letter-spacing="-4" fill="#202025">Hook Mode lives beside the note.</text>
  <text x="70" y="158" font-family="Arial, sans-serif" font-size="20" fill="#6f6a75">One compact hook card per section appears in the left margin of the Obsidian editor.</text>

  <g transform="translate(70 190)" filter="url(#shadow)">
    <rect x="0" y="0" width="1300" height="710" rx="18" fill="#fffdf8" stroke="#d8d0c5"/>
    <rect x="0" y="0" width="1300" height="54" rx="18" fill="#eeeaf6"/>
    <rect x="0" y="36" width="1300" height="18" fill="#eeeaf6"/>
    <circle cx="24" cy="27" r="6" fill="#ff5f57"/><circle cx="44" cy="27" r="6" fill="#febc2e"/><circle cx="64" cy="27" r="6" fill="#28c840"/>
    <rect x="470" y="14" width="250" height="28" rx="8" fill="#fff" stroke="#d1cbe0"/>
    <text x="492" y="33" font-family="Arial, sans-serif" font-size="13" fill="#686172">claude22</text>
    <rect x="1110" y="12" width="145" height="30" rx="15" fill="#202025"/>
    <text x="1128" y="32" font-family="Arial, sans-serif" font-size="12" font-weight="800" fill="#fff">CueCraft: Hook Mode</text>

    <rect x="0" y="54" width="176" height="656" fill="#ddd8fb"/>
    <text x="22" y="91" font-family="Arial, sans-serif" font-size="13" font-weight="900" fill="#564f67">Claude for Execs</text>
    <rect x="18" y="116" width="132" height="28" rx="8" fill="#cfc8f3"/>
    <text x="32" y="135" font-family="Arial, sans-serif" font-size="13" font-weight="800" fill="#302a45">claude22</text>
    <text x="32" y="174" font-family="Arial, sans-serif" font-size="13" fill="#5f5870">Cloddy</text>
    <text x="32" y="208" font-family="Arial, sans-serif" font-size="13" fill="#5f5870">exciting-cornell...</text>

    <g transform="translate(224 108)">
      <rect x="0" y="0" width="238" height="530" rx="24" fill="#f3ecdf" stroke="#e0d5c6"/>
      <text x="18" y="30" font-family="Arial, sans-serif" font-size="11" font-weight="900" letter-spacing="2" fill="#776a57">HOOK REVIEW</text>
      <text x="172" y="30" font-family="Arial, sans-serif" font-size="11" font-weight="900" letter-spacing="2" fill="#776a57">3 SECTIONS</text>

      <g transform="translate(16 50)">
        <rect x="0" y="0" width="206" height="130" rx="20" fill="#201915"/>
        <rect x="9" y="9" width="188" height="112" rx="15" fill="url(#hot)"/>
        <text x="23" y="31" font-family="Arial, sans-serif" font-size="9" font-weight="900" letter-spacing="1.4" fill="#211915" opacity="0.7">01 DOGS · ACTIVE</text>
        <text x="23" y="64" font-family="Arial Black, Arial, sans-serif" font-size="24" font-weight="900" letter-spacing="-2" fill="#211915">Who are the</text>
        <text x="23" y="88" font-family="Arial Black, Arial, sans-serif" font-size="24" font-weight="900" letter-spacing="-2" fill="#211915">dogs we love?</text>
        <rect x="23" y="98" width="70" height="18" rx="9" fill="#fffdf8" opacity="0.62"/>
        <text x="33" y="111" font-family="Arial, sans-serif" font-size="10" font-weight="900" fill="#211915">Tzimmes</text>
        <rect x="101" y="98" width="70" height="18" rx="9" fill="#211915" opacity="0.16" stroke="#211915" stroke-dasharray="5 4"/>
        <text x="113" y="111" font-family="Arial, sans-serif" font-size="10" font-weight="900" fill="#211915" opacity="0.62">Tonks</text>
      </g>

      <g transform="translate(16 194)">
        <rect x="0" y="0" width="206" height="152" rx="20" fill="#201915"/>
        <rect x="9" y="9" width="188" height="134" rx="15" fill="url(#teal)"/>
        <text x="23" y="31" font-family="Arial, sans-serif" font-size="9" font-weight="900" letter-spacing="1.4" fill="#082f33" opacity="0.76">02 TERMS · QUEUED</text>
        <text x="23" y="64" font-family="Arial Black, Arial, sans-serif" font-size="24" font-weight="900" letter-spacing="-2" fill="#082f33">Chatbot or</text>
        <text x="23" y="88" font-family="Arial Black, Arial, sans-serif" font-size="24" font-weight="900" letter-spacing="-2" fill="#082f33">agent? Prove it.</text>
        <rect x="23" y="100" width="55" height="18" rx="9" fill="#fffdf8" opacity="0.62"/><text x="33" y="113" font-family="Arial, sans-serif" font-size="10" font-weight="900" fill="#082f33">plans</text>
        <rect x="84" y="100" width="62" height="18" rx="9" fill="#fffdf8" opacity="0.62"/><text x="94" y="113" font-family="Arial, sans-serif" font-size="10" font-weight="900" fill="#082f33">decides</text>
        <rect x="23" y="123" width="86" height="18" rx="9" fill="#082f33" opacity="0.16" stroke="#082f33" stroke-dasharray="5 4"/><text x="33" y="136" font-family="Arial, sans-serif" font-size="10" font-weight="900" fill="#082f33" opacity="0.7">uses tools</text>
      </g>

      <g transform="translate(16 360)">
        <rect x="0" y="0" width="206" height="102" rx="20" fill="#201915"/>
        <rect x="9" y="9" width="188" height="84" rx="15" fill="url(#hot)"/>
        <text x="23" y="31" font-family="Arial, sans-serif" font-size="9" font-weight="900" letter-spacing="1.4" fill="#211915" opacity="0.7">03 UPSKILL</text>
        <text x="23" y="62" font-family="Arial Black, Arial, sans-serif" font-size="21" font-weight="900" letter-spacing="-1.7" fill="#211915">How do employees</text>
        <text x="23" y="83" font-family="Arial Black, Arial, sans-serif" font-size="21" font-weight="900" letter-spacing="-1.7" fill="#211915">get AI-shippable?</text>
      </g>

      <rect x="16" y="476" width="206" height="38" rx="17" fill="#176d73"/>
      <text x="32" y="500" font-family="Arial, sans-serif" font-size="13" font-weight="900" fill="#fffdf8">Final summary card</text>
    </g>

    <g transform="translate(510 120)">
      <text x="0" y="0" font-family="Arial Black, Arial, sans-serif" font-size="29" font-weight="900" letter-spacing="-1.2" fill="#202025">Dogs We Love</text>
      <rect x="-16" y="-24" width="5" height="32" rx="3" fill="#f0aa20"/>
      <text x="0" y="35" font-family="Arial, sans-serif" font-size="17" fill="#37333d">1. Tzimmes is a dog</text>
      <text x="0" y="64" font-family="Arial, sans-serif" font-size="17" fill="#37333d">2. So is Tonks</text>

      <text x="0" y="150" font-family="Arial Black, Arial, sans-serif" font-size="29" font-weight="900" letter-spacing="-1.2" fill="#202025">Terms</text>
      <rect x="-16" y="126" width="5" height="32" rx="3" fill="#f0aa20"/>
      <text x="0" y="185" font-family="Arial, sans-serif" font-size="17" fill="#37333d">1. Agent - Independent AI that can plan, decide, and use tools.</text>
      <text x="0" y="214" font-family="Arial, sans-serif" font-size="17" fill="#37333d">2. Chatbot - single-turn interaction AI app.</text>
      <text x="0" y="243" font-family="Arial, sans-serif" font-size="17" fill="#37333d">3. Claude Code - works from the dev env.</text>
      <text x="0" y="272" font-family="Arial, sans-serif" font-size="17" fill="#37333d">4. Plugins - customize Claude for a role/team.</text>

      <text x="0" y="386" font-family="Arial Black, Arial, sans-serif" font-size="29" font-weight="900" letter-spacing="-1.2" fill="#202025">How To Upskill Employees</text>
      <rect x="-16" y="362" width="5" height="32" rx="3" fill="#f0aa20"/>
      <text x="0" y="421" font-family="Arial, sans-serif" font-size="17" fill="#37333d">Tailor AI training around standards, terms, tools, and knowledge.</text>
      <text x="0" y="450" font-family="Arial, sans-serif" font-size="17" fill="#37333d">1. Requires encoding organizational knowledge.</text>
      <text x="0" y="479" font-family="Arial, sans-serif" font-size="17" fill="#37333d">2. Teach methodology, compliance, and brand voice.</text>
      <text x="0" y="508" font-family="Arial, sans-serif" font-size="17" fill="#37333d">3. Reduce time to collect info and visualize results.</text>
    </g>
  </g>
</svg>
